name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  node-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  sidecar-gateway-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run sidecar/Gateway orchestration contract
        run: node --test sidecar/test/monitor-orchestration.test.js

  swift-unit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Release DMGs are built with Swift 6.2; CI compiles with the same
      # major toolchain, or a construct one accepts and the other rejects
      # passes here and breaks there. The newest Xcode on the image is used,
      # and anything older than Swift 6.2 fails the job.
      - name: Select Xcode (Swift 6.2+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
          swift --version 2>&1 | grep -qE "Swift version 6\.([2-9]|[1-9][0-9])" \
            || { echo "error: $XCODE does not provide Swift 6.2 or newer" >&2; exit 1; }
      - run: sh macos/scripts/test-models.sh

  swift-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Release DMGs are built with Swift 6.2; CI compiles with the same
      # major toolchain, or a construct one accepts and the other rejects
      # passes here and breaks there. The newest Xcode on the image is used,
      # and anything older than Swift 6.2 fails the job.
      - name: Select Xcode (Swift 6.2+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
          swift --version 2>&1 | grep -qE "Swift version 6\.([2-9]|[1-9][0-9])" \
            || { echo "error: $XCODE does not provide Swift 6.2 or newer" >&2; exit 1; }
      - run: swift build --package-path macos -c debug

  package-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Release DMGs are built with Swift 6.2; CI compiles with the same
      # major toolchain, or a construct one accepts and the other rejects
      # passes here and breaks there. The newest Xcode on the image is used,
      # and anything older than Swift 6.2 fails the job.
      - name: Select Xcode (Swift 6.2+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
          swift --version 2>&1 | grep -qE "Swift version 6\.([2-9]|[1-9][0-9])" \
            || { echo "error: $XCODE does not provide Swift 6.2 or newer" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Gateway provenance check needs npm 11's attestation report;
      # Node 22 bundles npm 10.
      - run: npm install -g npm@11.19.1
      - name: Prepare verified official Node runtime
        run: echo "ACP_LYNK_NODE_DIST_DIR=$(sh macos/scripts/prepare-node-runtime.sh)" >> "$GITHUB_ENV"
      - name: Build packaged app
        env:
          ACP_LYNK_APP_VERSION: 0.6.1-beta.6
          ACP_LYNK_BUILD_NUMBER: 26
        run: sh macos/scripts/build-app.sh
      - name: Run packaged Gateway and sidecar smoke test
        run: node scripts/package-smoke.js build/AgenLynk.app
