name: ACP upstream monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: acp-upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BRANCH: automation/acp-upstream-monitor
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh ACP upstream snapshot
        run: node scripts/acp-upstream-monitor.js --update --report "$RUNNER_TEMP/acp-upstream-report.md"
      - name: Sync repository-managed ACP adapters
        run: npm run monitor:sync-dependencies
      - run: npm run ci
      - name: Detect snapshot changes
        id: changes
        run: |
          if git diff --quiet -- config/acp-upstream.snapshot.json package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update compatibility PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add config/acp-upstream.snapshot.json package.json package-lock.json
          git commit -m "chore: monitor ACP upstream versions"
          git push --force origin "HEAD:refs/heads/$UPDATE_BRANCH"
          PR_NUMBER="$(gh pr list --base dev --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/acp-upstream-report.md"
          else
            gh pr create --base dev --head "$UPDATE_BRANCH" --title "chore: review ACP upstream updates" --body-file "$RUNNER_TEMP/acp-upstream-report.md"
          fi
