<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP Gateway Monitor</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --panel2: #1c232e; --border: #2a3441;
    --text: #d7dee8; --dim: #8494a7; --accent: #4da3ff;
    --green: #3fb96f; --amber: #e0a63c; --red: #e05b5b; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.ok { background: var(--green); }
  .meta { color: var(--dim); font-size: 12px; margin-left: auto; display: flex; gap: 14px; }

  main { flex: 1; display: grid; grid-template-columns: 280px 1fr 300px; min-height: 0; }

  /* session list */
  #sessions { border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel); }
  #sessions .head { padding: 10px 12px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; display:flex; justify-content:space-between; align-items:center; }
  #sessions label { cursor: pointer; user-select: none; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .sess { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .sess:hover { background: var(--panel2); }
  .sess.sel { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 9px; }
  .sess .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sess .t .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .sess .sub { color: var(--dim); font-size: 11px; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
  .sess .sub .prov { color: var(--accent); }

  /* center column */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #toolbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #toolbar .modes { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #toolbar .modes button { background: none; border: 0; color: var(--dim); padding: 4px 14px; cursor: pointer; font: inherit; font-size: 12px; }
  #toolbar .modes button.on { background: var(--panel2); color: var(--text); font-weight: 600; }
  #toolbar .hint { color: var(--dim); font-size: 11px; margin-left: auto; }
  #timeline { flex: 1; overflow-y: auto; padding: 14px 18px; min-width: 0; }
  #timeline .empty { color: var(--dim); padding: 40px; text-align: center; }

  /* ===== detail (card) view ===== */
  .turn { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; background: var(--panel); overflow: hidden; }
  .turn > .head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim);
  }
  .turn > .head .id { font-family: ui-monospace, Menlo, monospace; }
  .badge { padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); }
  .badge.end_turn { color: var(--green); border-color: var(--green); }
  .badge.cancelled { color: var(--amber); border-color: var(--amber); }
  .badge.error { color: var(--red); border-color: var(--red); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  .turn .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .prompt { background: #10202f; border: 1px solid #234; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .prompt .lbl { color: var(--accent); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  details.thought { color: var(--dim); }
  details.thought summary { cursor: pointer; font-size: 12px; color: var(--purple); }
  details.thought pre { white-space: pre-wrap; word-break: break-word; margin-top: 4px; padding: 6px 8px; background: var(--panel2); border-radius: 6px; }
  .tool { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--panel2); font-size: 12px; }
  .tool .name { font-weight: 600; }
  .tool .st { float: right; color: var(--dim); }
  .tool .st.completed { color: var(--green); }
  .tool .st.failed { color: var(--red); }
  .tool pre { margin-top: 4px; color: var(--dim); max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .perm { border: 1px solid var(--amber); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .perm .lbl { color: var(--amber); font-weight: 600; }
  .sys { color: var(--dim); font-size: 11px; }
  .err { color: var(--red); white-space: pre-wrap; }

  /* ===== sequence view ===== */
  .seqturn { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; background: var(--panel); overflow: hidden; }
  .seqturn > .head {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: var(--panel2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim);
  }
  .lanes { display: grid; grid-template-columns: 64px 1fr; }
  .lanehead { display: grid; grid-template-columns: repeat(2, 1fr); padding: 8px 0 2px; font-size: 11px; color: var(--dim); font-weight: 600; text-align: center; grid-column: 2; }
  .lanehead span b { color: var(--text); }
  .steps { grid-column: 1 / -1; }
  .step { display: grid; grid-template-columns: 64px 1fr; align-items: center; min-height: 30px; }
  .step:hover { background: #ffffff08; }
  .step .ts { color: var(--dim); font-size: 10px; text-align: right; padding-right: 8px; font-family: ui-monospace, Menlo, monospace; }
  .step .track {
    position: relative; height: 30px;
    background-image: linear-gradient(var(--border), var(--border)), linear-gradient(var(--border), var(--border));
    background-repeat: no-repeat;
    background-size: 1px 100%, 1px 100%;
    background-position: calc(25% - .5px) 0, calc(75% - .5px) 0;
  }
  .arrow { position: absolute; top: 50%; height: 0; border-top: 1.5px solid var(--c, var(--dim)); cursor: default; }
  .arrow.dashed { border-top-style: dashed; }
  .arrow::after {
    content: ""; position: absolute; top: -4.5px; border: 4px solid transparent;
  }
  .arrow.r::after { right: -2px; border-left: 7px solid var(--c, var(--dim)); }
  .arrow.l::after { left: -2px; border-right: 7px solid var(--c, var(--dim)); }
  .arrow .lb {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    max-width: 96%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 11px; color: var(--text); background: var(--panel); padding: 0 6px; border-radius: 4px;
  }
  .selfbox {
    position: absolute; top: 50%; transform: translate(-50%, -50%); left: 50%;
    max-width: 30%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 11px; color: var(--c, var(--dim)); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; cursor: default;
  }
  .step .count { color: var(--dim); font-weight: 400; }

  /* ===== overview (multi-worker) view ===== */
  .ovhead {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: grid; grid-template-columns: 64px 1fr; padding: 6px 0 4px;
    border-bottom: 1px solid var(--border);
  }
  .ovhead .cols { display: grid; text-align: center; font-size: 11px; color: var(--dim); }
  .ovhead .cols .lane { min-width: 0; padding: 0 4px; }
  .ovhead .cols .lane b { display: block; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ovhead .cols .lane .mdl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== live status page (/live) ===== */
  body.live #sessions, body.live #side { display: none; }
  body.live main { grid-template-columns: 1fr; }
  .livegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 14px; align-items: start; }
  .livecard { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .livecard.attn { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
  .livecard > .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel2); border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .livecard > .head .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
  .livecard.attn > .head .pulse { background: var(--amber); }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  .livecard > .head .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .livecard > .head .m { color: var(--dim); white-space: nowrap; }
  .livecard > .head .el { margin-left: auto; color: var(--dim); white-space: nowrap; }
  .livecard .steps { padding: 4px 8px 8px; max-height: 320px; overflow-y: auto; }
  .livecard .wait { padding: 8px 12px; border-top: 1px dashed var(--amber); color: var(--amber); font-size: 12px; }
  .livedone { margin-top: 18px; }
  .livedone h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .livedone .row { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); padding: 3px 0; }
  .bigempty { text-align: center; color: var(--dim); padding: 80px 20px; font-size: 15px; }
  .bigempty .sub { font-size: 12px; margin-top: 8px; }
  #toolbar a { color: var(--accent); font-size: 12px; text-decoration: none; margin-left: 10px; }

  /* markdown rendering (프롬프트/응답 본문) */
  .mdbody { white-space: normal; word-break: break-word; }
  .mdbody .md-h1 { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .mdbody .md-h2 { font-size: 14px; font-weight: 700; margin: 6px 0 2px; }
  .mdbody .md-h3, .mdbody .md-h4 { font-size: 13px; font-weight: 700; margin: 5px 0 2px; }
  .mdbody ul, .mdbody ol { padding-left: 18px; margin: 2px 0; }
  .mdbody li { margin: 1px 0; }
  .mdbody .md-code { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  .mdbody code.md-inline { background: var(--panel2); padding: 0 4px; border-radius: 4px; }
  .mdbody .md-bq { border-left: 3px solid var(--border); padding-left: 8px; color: var(--dim); margin: 2px 0; }
  .mdbody .md-gap { height: 6px; }
  .mdbody a { color: var(--accent); }

  /* tooltip */
  #tip {
    position: fixed; z-index: 50; display: none; max-width: 520px; max-height: 340px; overflow: auto;
    background: #0b0e13; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; box-shadow: 0 8px 30px #000a; white-space: pre-wrap; word-break: break-word;
  }
  #tip .tt { color: var(--accent); font-weight: 600; font-size: 11px; margin-bottom: 4px; }
  #tip.pinned { border-color: var(--amber); }

  /* narrow viewports: stack panels vertically, sessions as a horizontal strip */
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    #sessions { display: flex; align-items: stretch; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
    #sessions .head { flex: none; flex-direction: column; justify-content: center; gap: 4px; border-right: 1px solid var(--border); }
    #sessionList { display: flex; }
    .sess { min-width: 190px; max-width: 230px; border-bottom: 0; border-right: 1px solid var(--border); }
    .sess.sel { border-left: 0; border-top: 3px solid var(--accent); padding: 7px 12px 9px; }
    #side { border-left: 0; border-top: 1px solid var(--border); max-height: 26vh; flex-direction: row; }
    #side > div { flex: 1; min-width: 0; }
    #toolbar .hint { display: none; }
  }

  /* right panel */
  #side { border-left: 1px solid var(--border); overflow-y: auto; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 16px; }
  #side h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; background: var(--panel2); }
  .card .k { color: var(--dim); }
  .none { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>ACP Gateway Monitor</h1>
  <span class="conn"><span class="dot" id="connDot"></span><span id="connText">연결 중…</span></span>
  <span class="meta">
    <span id="mVersion"></span>
    <span id="mLive"></span>
    <span id="mEvents"></span>
  </span>
</header>
<main>
  <nav id="sessions">
    <div class="head"><span>세션</span><label><input type="checkbox" id="activeOnly"> 활성만</label></div>
    <div id="sessionList"></div>
  </nav>
  <section id="center">
    <div id="toolbar">
      <div class="modes">
        <button id="modeAll" class="on">전체</button>
        <button id="modeSeq">시퀀스</button>
        <button id="modeDetail">상세</button>
      </div>
      <a href="/live" target="_blank" id="liveLink">현황 페이지 ↗</a>
      <span class="hint">항목에 마우스를 올리면 세부 내용, 클릭하면 고정</span>
    </div>
    <div id="timeline"><div class="empty">세션을 선택하세요</div></div>
  </section>
  <aside id="side">
    <div><h2>인박스 (대기 중 요청)</h2><div id="inbox"></div></div>
    <div><h2>태스크</h2><div id="tasks"></div></div>
  </aside>
</main>
<div id="tip"></div>
<script>
const store = { sessions: [], events: {}, tasks: [], inbox: [], gateway: null, connected: false, selected: null, mode: "all" };
const PROVIDER_COLOR = { claude: "#e8935a", codex: "#4da3ff", grok: "#a78bfa", cursor: "#3fb96f", auggie: "#e0a63c" };
const provColor = (p) => PROVIDER_COLOR[p] ?? "var(--dim)";
const ACTIVE = new Set(["running", "waiting_permission", "waiting_input", "cancelling", "restoring", "idle"]);
const STATUS_COLOR = {
  running: "var(--accent)", idle: "var(--green)", waiting_permission: "var(--amber)",
  waiting_input: "var(--amber)", cancelling: "var(--amber)", restoring: "var(--accent)",
  error: "var(--red)", disconnected: "var(--dim)", cancelled: "var(--dim)",
  closed: "var(--dim)", unavailable: "var(--red)"
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rel = (ts) => {
  if (!ts) return "";
  const d = Date.now() - new Date(ts).getTime();
  if (d < 60e3) return Math.max(1, Math.round(d / 1e3)) + "초 전";
  if (d < 3600e3) return Math.round(d / 60e3) + "분 전";
  if (d < 86400e3) return Math.round(d / 3600e3) + "시간 전";
  return Math.round(d / 86400e3) + "일 전";
};
const hms = (ts) => ts ? new Date(ts).toTimeString().slice(0, 8) : "";

// 외부 의존성 없는 경량 마크다운 렌더러 — 입력을 먼저 HTML 이스케이프하므로 안전하다.
// 코드펜스, 인라인 코드, 굵게/기울임, 링크, 제목, 목록, 인용만 지원한다.
function renderMarkdown(src) {
  const blocks = [];
  let text = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, _lang, code) => {
    blocks.push(`<pre class="md-code">${esc(code.replace(/\n$/, ""))}</pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  text = esc(text)
    .replace(/`([^`\n]+)`/g, '<code class="md-inline">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of text.split("\n")) {
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const bq = line.match(/^&gt;\s?(.*)$/);
    if (h) { closeList(); out.push(`<div class="md-h${h[1].length}">${h[2]}</div>`); }
    else if (ul) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${ul[1]}</li>`); }
    else if (ol) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${ol[1]}</li>`); }
    else if (bq) { closeList(); out.push(`<div class="md-bq">${bq[1]}</div>`); }
    else if (!line.trim()) { closeList(); out.push('<div class="md-gap"></div>'); }
    else { closeList(); out.push(`<div>${line}</div>`); }
  }
  closeList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[Number(i)]);
}

function renderHeader() {
  document.getElementById("connDot").className = "dot" + (store.connected ? " ok" : "");
  document.getElementById("connText").textContent = store.connected ? "게이트웨이 연결됨" : (store.error || "연결 끊김");
  const g = store.gateway;
  document.getElementById("mVersion").textContent = g ? "v" + g.gatewayVersion : "";
  document.getElementById("mLive").textContent = g ? "라이브 세션 " + (g.lifecycle?.liveSessions ?? 0) : "";
  const total = g ? Object.values(g.metrics?.eventsByType ?? {}).reduce((a, b) => a + b, 0) : 0;
  document.getElementById("mEvents").textContent = g ? "누적 이벤트 " + total.toLocaleString() : "";
}

function renderSessions() {
  const activeOnly = document.getElementById("activeOnly").checked;
  const list = [...store.sessions]
    .filter((s) => !activeOnly || ACTIVE.has(s.status))
    .sort((a, b) => (b.updatedAt ?? "").localeCompare(a.updatedAt ?? ""));
  document.getElementById("sessionList").innerHTML = list.map((s) => `
    <div class="sess${s.sessionId === store.selected ? " sel" : ""}" data-id="${esc(s.sessionId)}">
      <div class="t"><span class="st" style="background:${STATUS_COLOR[s.status] ?? "var(--dim)"}"></span>${esc(s.title || s.sessionId)}</div>
      <div class="sub"><span><span class="prov">${esc(s.provider)}</span> · ${esc(s.model ?? "")}</span><span>${esc(s.status)} · ${rel(s.updatedAt)}</span></div>
    </div>`).join("") || '<div class="none" style="padding:12px">세션 없음</div>';
}

function turnsOf(sessionId) {
  const events = store.events[sessionId] ?? [];
  const turns = [];
  const byId = new Map();
  for (const ev of events) {
    const key = ev.turnId ?? "no-turn";
    if (!byId.has(key)) {
      const turn = { turnId: key, items: [], start: ev.ts, end: null, stopReason: null };
      byId.set(key, turn);
      turns.push(turn);
    }
    const turn = byId.get(key);
    turn.items.push(ev);
    if (ev.type === "turn_end") { turn.end = ev.ts; turn.stopReason = ev.stopReason; }
    if (ev.type === "error") { turn.end = ev.ts; turn.stopReason = "error"; }
  }
  return turns;
}

/* ===== step extraction: compress raw events into sequence-diagram steps =====
   프롬프트 ↔ 응답 ↔ 사고 중심의 간략 뷰. tool call·시스템 이벤트는 여기서 제외하고
   상세(카드) 뷰에서만 보여준다. hover 내용은 프롬프트/응답/사고 전문. */
// lanes: 0 = Main, 1 = Worker
function stepsOf(turn) {
  const steps = [];
  let buffer = null; // 연속된 같은 종류의 청크(응답/사고)를 하나의 항목으로 병합
  const flushBuffer = () => {
    if (!buffer || !buffer.text.trim()) { buffer = null; return; }
    if (buffer.type === "agent_message_chunk") {
      steps.push({
        from: 1, to: 0, color: "var(--text)", ts: buffer.ts, md: true,
        label: buffer.text.replace(/\s+/g, " ").slice(0, 70),
        tipTitle: `응답 · ${buffer.text.length.toLocaleString()}자`, tip: buffer.text
      });
    } else {
      steps.push({
        self: 1, color: "var(--purple)", ts: buffer.ts, md: true,
        label: `사고 · ${buffer.text.length.toLocaleString()}자`,
        tipTitle: `사고 과정 · ${buffer.text.length.toLocaleString()}자`, tip: buffer.text
      });
    }
    buffer = null;
  };
  for (const ev of turn.items) {
    const t = ev.type;
    if (t === "agent_message_chunk" || t === "agent_thought_chunk") {
      if (buffer && buffer.type === t) buffer.text += ev.text ?? "";
      else { flushBuffer(); buffer = { type: t, text: ev.text ?? "", ts: ev.ts }; }
      continue;
    }
    // tool call 진행은 응답/사고 흐름을 끊는 이벤트가 아니므로 병합 버퍼를 유지한다
    if (t.startsWith("tool_call") || t === "usage_update") continue;
    flushBuffer();
    if (t === "turn_start") {
      steps.push({ from: 0, to: 1, color: "var(--accent)", ts: ev.ts, bold: true, md: true,
        label: ev.text ? ev.text.replace(/\s+/g, " ").slice(0, 70) : "프롬프트 (본문 미기록)",
        tipTitle: "프롬프트" + (ev.textTruncated ? " (잘림)" : ""), tip: ev.text || "게이트웨이 업데이트 이전 턴이라 본문이 기록되지 않았습니다." });
    } else if (t === "permission_request") {
      const opts = (ev.options ?? []).map((o) => o.name ?? o.optionId).join(" / ");
      steps.push({ from: 1, to: 0, color: "var(--amber)", dashed: true, ts: ev.ts, bold: true,
        label: `⏳ 권한 요청: ${ev.toolCall?.title ?? ""}`,
        tipTitle: "권한 요청", tip: `${ev.toolCall?.title ?? ""}\n옵션: ${opts}` });
    } else if (t === "permission_response") {
      steps.push({ from: 0, to: 1, color: "var(--green)", dashed: true, ts: ev.ts,
        label: `권한 응답: ${ev.optionId ?? ""}`, tipTitle: "권한 응답", tip: `optionId: ${ev.optionId ?? ""}` });
    } else if (t === "elicitation_request") {
      const m = typeof ev.message === "string" ? ev.message : JSON.stringify(ev.message);
      steps.push({ from: 1, to: 0, color: "var(--amber)", dashed: true, ts: ev.ts, bold: true,
        label: `❓ 질문: ${m?.slice(0, 50) ?? ""}`, tipTitle: "워커 질문", tip: m });
    } else if (t === "elicitation_response") {
      steps.push({ from: 0, to: 1, color: "var(--green)", dashed: true, ts: ev.ts, label: "질문 응답", tipTitle: "질문 응답", tip: "질문에 응답했습니다." });
    } else if (t === "error") {
      steps.push({ from: 1, to: 0, color: "var(--red)", ts: ev.ts, bold: true, label: `⛔ ${String(ev.text ?? "").slice(0, 60)}`, tipTitle: "오류", tip: ev.text });
    } else if (t === "turn_end") {
      const dur = turn.end && turn.start ? Math.round((new Date(turn.end) - new Date(turn.start)) / 1000) + "s" : "";
      steps.push({ from: 1, to: 0, color: "var(--green)", ts: ev.ts, label: `턴 종료 · ${ev.stopReason ?? ""} · ${dur}`, tipTitle: "턴 종료", tip: `${ev.stopReason ?? ""} · ${dur}` });
    }
    // 그 외 시스템 이벤트(session_info_update 등)는 간략 뷰에서 표시하지 않는다
  }
  flushBuffer();
  return steps;
}

let TIPS = [];
function tipAttr(title, body, md = false) {
  TIPS.push({ title, body: String(body ?? ""), md });
  return `data-tip="${TIPS.length - 1}"`;
}
function tipHtml(data, pinnedMark = "") {
  const body = data.md ? `<div class="mdbody">${renderMarkdown(data.body)}</div>` : esc(data.body);
  return `<div class="tt">${esc(data.title)}${pinnedMark}</div>${body}`;
}

/* ===== overview: Main 하나 + 워커 레인 여러 개, 전 세션 병합 ===== */
const MAX_LANES = 5;
function renderOverview() {
  const workers = store.sessions
    .filter((s) => (store.events[s.sessionId] ?? []).length)
    .sort((a, b) => (b.updatedAt ?? "").localeCompare(a.updatedAt ?? ""))
    .slice(0, MAX_LANES)
    .sort((a, b) => (a.createdAt ?? "").localeCompare(b.createdAt ?? ""));
  if (!workers.length) return '<div class="empty">메모리에 이벤트가 있는 세션이 없습니다</div>';
  const laneCount = workers.length + 1;
  const center = (i) => ((i + 0.5) / laneCount) * 100;

  // 세션별 스텝 생성 후 시간순 병합; tool call은 워커 레인 위의 자기 박스로 접는다
  const merged = [];
  workers.forEach((s, w) => {
    const lane = w + 1;
    let k = 0;
    for (const turn of turnsOf(s.sessionId)) {
      for (const st of stepsOf(turn)) {
        const m = { ...st, _t: st.ts ?? "", _k: k++ };
        if (m.self != null) m.self = lane;
        else { m.from = m.from === 0 ? 0 : lane; m.to = m.to === 0 ? 0 : lane; }
        merged.push(m);
      }
    }
  });
  merged.sort((a, b) => a._t === b._t ? a._k - b._k : (a._t < b._t ? -1 : 1));

  const lifelines = Array.from({ length: laneCount }, (_, i) => center(i));
  const trackStyle = `background-image:${lifelines.map(() => "linear-gradient(var(--border),var(--border))").join(",")};` +
    `background-size:${lifelines.map(() => "1px 100%").join(",")};` +
    `background-position:${lifelines.map((c) => `calc(${c}% - .5px) 0`).join(",")};background-repeat:no-repeat`;

  const rows = merged.map((s) => {
    let inner;
    if (s.self != null) {
      inner = `<span class="selfbox" style="--c:${s.color}; left:${center(s.self)}%; max-width:${90 / laneCount}%" ${tipAttr(s.tipTitle, s.tip, s.md)}>${esc(s.label)}</span>`;
    } else {
      const a = center(s.from), b = center(s.to);
      const left = Math.min(a, b), width = Math.abs(a - b);
      const dir = b > a ? "r" : "l";
      inner = `<div class="arrow ${dir}${s.dashed ? " dashed" : ""}" style="--c:${s.color}; left:${left}%; width:${width}%" ${tipAttr(s.tipTitle, s.tip, s.md)}>
        <span class="lb" style="${s.bold ? "font-weight:600;" : ""}color:${s.color}">${esc(s.label)}</span></div>`;
    }
    return `<div class="step"><span class="ts">${hms(s.ts)}</span><div class="track" style="${trackStyle}">${inner}</div></div>`;
  }).join("");

  const heads = `<div class="lane"><b>Main</b><span class="mdl">오케스트레이터</span></div>` + workers.map((s) => `
    <div class="lane" style="color:${provColor(s.provider)}" title="${esc(s.title ?? "")}">
      <b>${esc(s.provider)} · ${esc(s.model ?? "?")}</b>
      <span class="mdl">${esc(s.title || s.sessionId)}</span>
    </div>`).join("");
  const skipped = store.sessions.filter((s) => (store.events[s.sessionId] ?? []).length).length - workers.length;
  return `<div class="ovhead"><span></span><div class="cols" style="grid-template-columns:repeat(${laneCount},1fr)">${heads}</div></div>
    <div>${rows}</div>
    ${skipped > 0 ? `<div class="sys" style="padding:8px 0 0 64px">+ ${skipped}개 세션은 레인 제한으로 생략됨 (최근 ${MAX_LANES}개 표시)</div>` : ""}`;
}

const LANE_CENTER = [25, 75];
// 2레인(Main/Worker) 스텝 한 줄 — 시퀀스 뷰와 현황 카드가 공유
function stepRowHtml(s) {
  let inner;
  if (s.self != null) {
    inner = `<span class="selfbox" style="--c:${s.color}; left:${LANE_CENTER[s.self]}%" ${tipAttr(s.tipTitle, s.tip, s.md)}>${esc(s.label)}</span>`;
  } else {
    const a = LANE_CENTER[s.from], b = LANE_CENTER[s.to];
    const left = Math.min(a, b), width = Math.abs(a - b);
    const dir = b > a ? "r" : "l";
    inner = `<div class="arrow ${dir}${s.dashed ? " dashed" : ""}" style="--c:${s.color}; left:${left}%; width:${width}%" ${tipAttr(s.tipTitle, s.tip, s.md)}>
      <span class="lb" style="${s.bold ? "font-weight:600;" : ""}color:${s.color}">${esc(s.label)}</span></div>`;
  }
  return `<div class="step"><span class="ts">${hms(s.ts)}</span><div class="track">${inner}</div></div>`;
}

function renderSequence(session, turns) {
  return turns.map((turn) => {
    const running = !turn.end && session && ACTIVE.has(session.status) && session.turnId === turn.turnId;
    const badge = turn.stopReason ?? (running ? "running" : "");
    const rows = stepsOf(turn).map(stepRowHtml).join("");
    return `<div class="seqturn">
      <div class="head">
        <span class="id">${esc(String(turn.turnId).slice(0, 13))}</span>
        <span>${hms(turn.start)}</span>
        ${badge ? `<span class="badge ${esc(badge)}" style="margin-left:auto">${esc(badge)}</span>` : ""}
      </div>
      <div class="lanes">
        <span></span>
        <div class="lanehead"><span><b>Main</b> 오케스트레이터</span><span style="color:${provColor(session?.provider)}"><b>Worker</b> ${esc(session?.provider ?? "")} · ${esc(session?.model ?? "?")}</span></div>
        <div class="steps">${rows}</div>
      </div>
    </div>`;
  }).join("");
}

/* ===== live status page (/live): 진행 중인 세션만 카드로 ===== */
const LIVE = location.pathname === "/live";
const LIVE_STATUSES = new Set(["running", "waiting_permission", "waiting_input", "cancelling", "restoring"]);
const elapsed = (ts) => {
  if (!ts) return "";
  const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
  return s < 60 ? s + "초" : s < 3600 ? Math.floor(s / 60) + "분 " + (s % 60) + "초" : Math.floor(s / 3600) + "시간 " + Math.floor((s % 3600) / 60) + "분";
};

function renderLive() {
  const active = store.sessions
    .filter((s) => LIVE_STATUSES.has(s.status))
    .sort((a, b) => (a.createdAt ?? "").localeCompare(b.createdAt ?? ""));
  const recentDone = store.sessions
    .filter((s) => !LIVE_STATUSES.has(s.status) && s.turnId
      && Date.now() - new Date(s.updatedAt ?? 0).getTime() < 10 * 60_000)
    .sort((a, b) => (b.updatedAt ?? "").localeCompare(a.updatedAt ?? ""));

  const cards = active.map((s) => {
    const turns = turnsOf(s.sessionId);
    const current = turns.find((t) => t.turnId === s.turnId) ?? turns.at(-1);
    const steps = current ? stepsOf(current) : [];
    const rows = steps.slice(-20).map(stepRowHtml).join("");
    const waiting = s.status === "waiting_permission" || s.status === "waiting_input";
    const pending = waiting ? store.inbox.find((i) => i.sessionId === s.sessionId && i.status === "pending") : null;
    return `<div class="livecard${waiting ? " attn" : ""}">
      <div class="head">
        <span class="pulse"></span>
        <span class="t">${esc(s.title || s.sessionId)}</span>
        <span class="m" style="color:${provColor(s.provider)}">${esc(s.provider)} · ${esc(s.model ?? "?")}</span>
        <span class="el">${esc(s.status)} · ${elapsed(current?.start ?? s.updatedAt)}</span>
      </div>
      <div class="steps" data-autoscroll>${rows || '<div class="sys" style="padding:8px 4px">이 턴의 이벤트가 아직 없습니다</div>'}</div>
      ${waiting ? `<div class="wait">⏳ 응답 대기 중${pending ? ": " + esc(pending.toolCall?.title ?? (typeof pending.message === "string" ? pending.message : "")) : ""} — Main의 permission/answer를 기다립니다</div>` : ""}
    </div>`;
  }).join("");

  const done = recentDone.length ? `<div class="livedone"><h2>최근 완료 (10분)</h2>${recentDone.map((s) => `
    <div class="row">
      <span class="st" style="width:8px;height:8px;border-radius:50%;background:${STATUS_COLOR[s.status] ?? "var(--dim)"}"></span>
      <span style="color:var(--text)">${esc(s.title || s.sessionId)}</span>
      <span style="color:${provColor(s.provider)}">${esc(s.provider)} · ${esc(s.model ?? "?")}</span>
      <span>${esc(s.stopReason ?? s.status)} · ${rel(s.updatedAt)}</span>
    </div>`).join("")}</div>` : "";

  if (!active.length) {
    return `<div class="bigempty">지금 진행 중인 작업이 없습니다<div class="sub">워커가 일을 시작하면 여기에 실시간으로 나타납니다</div></div>${done}`;
  }
  return `<div class="livegrid">${cards}</div>${done}`;
}

/* ===== detail view (기존 카드 뷰) ===== */
function renderTurnBody(items) {
  const out = [];
  const tools = new Map();
  let buffer = null;
  const flush = () => {
    if (!buffer) return;
    if (buffer.type === "agent_message_chunk") out.push(`<div class="msg mdbody">${renderMarkdown(buffer.text)}</div>`);
    else out.push(`<details class="thought"><summary>사고 과정 (${buffer.text.length.toLocaleString()}자)</summary><pre>${esc(buffer.text)}</pre></details>`);
    buffer = null;
  };
  for (const ev of items) {
    const t = ev.type;
    if (t === "agent_message_chunk" || t === "agent_thought_chunk") {
      if (buffer && buffer.type === t) buffer.text += ev.text ?? "";
      else { flush(); buffer = { type: t, text: ev.text ?? "" }; }
      continue;
    }
    flush();
    if (t === "turn_start") {
      out.push(`<div class="prompt mdbody"><div class="lbl">프롬프트${ev.textTruncated ? " (잘림)" : ""}</div>${ev.text ? renderMarkdown(ev.text) : "(본문 없음 — 게이트웨이 업데이트 이전 턴)"}</div>`);
    } else if (t === "tool_call" || t === "tool_call_update") {
      const d = ev.data ?? {};
      const id = d.toolCallId ?? "tool-" + tools.size;
      if (!tools.has(id)) {
        tools.set(id, { title: d.title ?? id, kind: d.kind, status: d.status ?? "pending", input: d.rawInput, anchor: out.length });
        out.push("");
      }
      const node = tools.get(id);
      if (d.title) node.title = d.title;
      if (d.status) node.status = d.status;
      if (d.rawInput) node.input = d.rawInput;
      out[node.anchor] = `<div class="tool"><span class="st ${esc(node.status)}">${esc(node.status)}</span><span class="name">🔧 ${esc(node.title)}</span>${node.kind ? ` <span class="k">(${esc(node.kind)})</span>` : ""}${node.input ? `<pre>${esc(JSON.stringify(node.input, null, 1))}</pre>` : ""}</div>`;
    } else if (t === "permission_request") {
      const opts = (ev.options ?? []).map((o) => esc(o.name ?? o.optionId)).join(" / ");
      out.push(`<div class="perm"><span class="lbl">⏳ 권한 요청</span> ${esc(ev.toolCall?.title ?? "")}${opts ? `<div class="sys">옵션: ${opts}</div>` : ""}</div>`);
    } else if (t === "permission_response") {
      out.push(`<div class="sys">✅ 권한 응답: ${esc(ev.optionId ?? JSON.stringify(ev.data ?? ""))}</div>`);
    } else if (t === "elicitation_request") {
      out.push(`<div class="perm"><span class="lbl">❓ 워커 질문</span> ${esc(typeof ev.message === "string" ? ev.message : JSON.stringify(ev.message))}</div>`);
    } else if (t === "elicitation_response") {
      out.push(`<div class="sys">✅ 질문 응답됨</div>`);
    } else if (t === "error") {
      out.push(`<div class="err">⛔ ${esc(ev.text)}</div>`);
    } else if (t === "turn_end") {
      // shown in the turn header
    } else if (t === "model_changed") {
      out.push(`<div class="sys">모델 변경 → ${esc(ev.model)}</div>`);
    } else if (t === "usage_update") {
      // 노이즈
    } else {
      out.push(`<div class="sys">${esc(t)}${ev.text ? ": " + esc(String(ev.text).slice(0, 200)) : ""}</div>`);
    }
  }
  flush();
  return out.join("");
}

function renderDetail(session, turns) {
  return turns.map((turn) => {
    const running = !turn.end && session && ACTIVE.has(session.status) && session.turnId === turn.turnId;
    const dur = turn.end ? Math.round((new Date(turn.end) - new Date(turn.start)) / 1000) + "s" : (running ? "진행 중" : "");
    const badge = turn.stopReason ?? (running ? "running" : "");
    return `<div class="turn">
      <div class="head">
        <span class="id">${esc(String(turn.turnId).slice(0, 13))}</span>
        <span>${hms(turn.start)}</span>
        <span>${dur}</span>
        ${badge ? `<span class="badge ${esc(badge)}" style="margin-left:auto">${esc(badge)}</span>` : ""}
      </div>
      <div class="body">${renderTurnBody(turn.items)}</div>
    </div>`;
  }).join("");
}

function renderTimeline() {
  const el = document.getElementById("timeline");
  if (pinned) return; // 고정 툴팁 열람 중엔 재렌더 보류
  TIPS = [];
  hideTip(true);
  if (LIVE) {
    el.innerHTML = renderLive();
    for (const box of el.querySelectorAll("[data-autoscroll]")) box.scrollTop = box.scrollHeight;
    return;
  }
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  if (store.mode === "all") {
    el.innerHTML = renderOverview();
    if (nearBottom) el.scrollTop = el.scrollHeight;
    return;
  }
  if (!store.selected) { el.innerHTML = '<div class="empty">세션을 선택하세요</div>'; return; }
  const session = store.sessions.find((s) => s.sessionId === store.selected);
  const turns = turnsOf(store.selected);
  if (!turns.length) {
    el.innerHTML = `<div class="empty">이 세션의 이벤트가 메모리에 없습니다.<br><span style="font-size:12px">(이벤트는 데몬 메모리에만 유지됩니다 — 모니터 실행 이후의 턴부터 표시됩니다)</span></div>`;
    return;
  }
  el.innerHTML = store.mode === "seq" ? renderSequence(session, turns) : renderDetail(session, turns);
  if (nearBottom) el.scrollTop = el.scrollHeight;
}

function renderSide() {
  const inbox = store.inbox.filter((i) => i.status === "pending" || i.status === "interrupted");
  document.getElementById("inbox").innerHTML = inbox.map((i) => `
    <div class="card">
      <div><b>${i.type === "permission_request" ? "권한 요청" : "워커 질문"}</b> <span class="k">${esc(i.status)}</span></div>
      <div class="k">${esc(i.sessionId)} · ${rel(i.createdAt)}</div>
      <div>${esc(i.toolCall?.title ?? (typeof i.message === "string" ? i.message : "") ?? "")}</div>
    </div>`).join("") || '<div class="none">대기 중 요청 없음</div>';
  document.getElementById("tasks").innerHTML = store.tasks.map((t) => `
    <div class="card">
      <div><b>${esc(t.status)}</b> <span class="k">${rel(t.lastUpdatedAt)}</span></div>
      <div class="k">${esc(t.taskId)}</div>
      <div>${esc(t.statusMessage ?? "")}</div>
    </div>`).join("") || '<div class="none">실행 중 태스크 없음</div>';
}

function renderAll() { renderHeader(); renderSessions(); renderTimeline(); renderSide(); }

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderAll(); });
}

/* ===== tooltip: hover로 보기, 클릭으로 고정 ===== */
const tip = document.getElementById("tip");
let pinned = false;
function showTip(index, x, y) {
  const data = TIPS[index];
  if (!data) return;
  tip.innerHTML = tipHtml(data);
  tip.style.display = "block";
  positionTip(x, y);
}
function positionTip(x, y) {
  const pad = 14;
  tip.style.left = Math.min(x + pad, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(y + pad, window.innerHeight - tip.offsetHeight - 8) + "px";
}
function hideTip(force) {
  if (pinned && !force) return;
  pinned = false;
  tip.classList.remove("pinned");
  tip.style.display = "none";
}
document.getElementById("timeline").addEventListener("mouseover", (e) => {
  if (pinned) return;
  const target = e.target.closest("[data-tip]");
  if (target) showTip(Number(target.dataset.tip), e.clientX, e.clientY);
  else hideTip();
});
document.getElementById("timeline").addEventListener("mousemove", (e) => {
  if (pinned || tip.style.display !== "block") return;
  positionTip(e.clientX, e.clientY);
});
document.getElementById("timeline").addEventListener("mouseleave", () => hideTip());
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-tip]");
  if (target) {
    pinned = true;
    tip.classList.add("pinned");
    showTipPinned(Number(target.dataset.tip), e.clientX, e.clientY);
  } else if (!tip.contains(e.target)) {
    hideTip(true);
  }
});
function showTipPinned(index, x, y) {
  const data = TIPS[index];
  if (!data) return;
  tip.innerHTML = tipHtml(data, " 📌");
  tip.style.display = "block";
  positionTip(x, y);
}

/* ===== interactions ===== */
document.getElementById("sessionList").addEventListener("click", (e) => {
  const row = e.target.closest(".sess");
  if (!row) return;
  store.selected = row.dataset.id;
  if (store.mode === "all") { setMode("seq"); return; } // 세션 클릭 = 그 세션의 시퀀스로
  renderAll();
});
document.getElementById("activeOnly").addEventListener("change", renderSessions);
document.getElementById("modeAll").addEventListener("click", () => setMode("all"));
document.getElementById("modeSeq").addEventListener("click", () => setMode("seq"));
document.getElementById("modeDetail").addEventListener("click", () => setMode("detail"));
function setMode(mode) {
  store.mode = mode;
  for (const [id, m] of [["modeAll", "all"], ["modeSeq", "seq"], ["modeDetail", "detail"]]) {
    document.getElementById(id).className = mode === m ? "on" : "";
  }
  renderSessions();
  renderTimeline();
}

async function loadSnapshot() {
  const res = await fetch("/api/snapshot");
  const snap = await res.json();
  Object.assign(store, {
    sessions: snap.sessions, events: snap.events, tasks: snap.tasks,
    inbox: snap.inbox, gateway: snap.gateway, connected: snap.connected, error: snap.error
  });
  if (!store.selected) {
    const running = store.sessions.find((s) => s.status === "running") ?? store.sessions
      .slice().sort((a, b) => (b.updatedAt ?? "").localeCompare(a.updatedAt ?? ""))[0];
    store.selected = running?.sessionId ?? null;
  }
  renderAll();
}

function connectStream() {
  const es = new EventSource("/api/stream");
  es.onmessage = (frame) => {
    const msg = JSON.parse(frame.data);
    if (msg.kind === "event") {
      const ev = msg.event;
      (store.events[ev.sessionId] ??= []).push(ev);
      queueRender();
    } else if (msg.kind === "state") {
      if (msg.sessions) store.sessions = msg.sessions;
      if (msg.tasks) store.tasks = msg.tasks;
      if (msg.inbox) store.inbox = msg.inbox;
      if (msg.connected === false) { store.connected = false; store.error = msg.error; }
      else store.connected = true;
      queueRender();
    }
  };
  es.onerror = () => { store.connected = false; renderHeader(); };
  es.onopen = () => loadSnapshot();
}

if (LIVE) {
  document.body.classList.add("live");
  document.title = "ACP 진행 현황";
  document.getElementById("toolbar").innerHTML =
    '<b style="font-size:12px">진행 중 세션 현황</b><a href="/">← 전체 대시보드</a><span class="hint">항목에 마우스를 올리면 세부 내용</span>';
  setInterval(renderTimeline, 5_000); // 경과 시간 갱신
}
loadSnapshot().then(connectStream);
setInterval(renderSessions, 30_000); // keep relative timestamps fresh
</script>
